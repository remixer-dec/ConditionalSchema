[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conditionalschema"
version = "0.1.0"
description = "Generate Pydantic schemas for conditionally present fields"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
lint = ["ruff>=0.6,<1"]
type = ["pyrefly>=0.18"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "pyrefly>=0.18"]

[tool.setuptools]
py-modules = ["main", "model", "conditions", "templates", "records", "schema"]

[tool.pytest.ini_options]
testpaths = ["test_crecord.py", "test_report_issues.py"]

[tool.ruff]
indent-width = 4
line-length = 128
target-version = "py310"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
ignore = ["I001"]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "RUF006",
    "ASYNC",
]
